name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://127.0.0.1:6379/1
      ACCEPTANCE_REVERIFY_TEST_REDIS_URL: redis://127.0.0.1:6379/2
      LEASE_LIFECYCLE_TEST_REDIS_URL: redis://127.0.0.1:6379/3
      LEGACY_REVIEW_TEST_REDIS_URL: redis://127.0.0.1:6379/4
      OWNERSHIP_TEST_REDIS_URL: redis://127.0.0.1:6379/5
      REPAIR_OWNERSHIP_TEST_REDIS_URL: redis://127.0.0.1:6379/6
      RESTORE_DOORBELL_TEST_REDIS_URL: redis://127.0.0.1:6379/7
      RESTORE_MAINTENANCE_TEST_REDIS_URL: redis://127.0.0.1:6379/8
      SUPERSEDE_TEST_REDIS_URL: redis://127.0.0.1:6379/9
      RUNTIME_RECONCILE_TEST_REDIS_URL: redis://127.0.0.1:6379/10
      STATUS_PROJECTION_TEST_REDIS_URL: redis://127.0.0.1:6379/11
      AGENT_EPOCH_TEST_REDIS_URL: redis://127.0.0.1:6379/12
      MCP_LAN_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      BLOCKING_CLAIM_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      P0A2_REGISTRY_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      P0A2_PARITY_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      P1_CREDENTIALS_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      P11_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      P9R_TEST_REDIS_URL: redis://127.0.0.1:6379/13
      BIAO_TEST_REDIS_PORT: '6379'
      OWNERSHIP_GLOB_REDIS_URL: redis://127.0.0.1:6379/14
      PLAN_REVISE_CAS_REDIS_URL: redis://127.0.0.1:6379/14
      PROJECT_AGENT_RESERVATION_REDIS_URL: redis://127.0.0.1:6379/14
      CLAIM_AUTO_JOIN_REDIS_URL: redis://127.0.0.1:6379/14
      BIAO_DISTRIBUTED_TEST_REDIS_URL: redis://127.0.0.1:6379/14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Audit high-severity vulnerabilities
        run: |
          npm audit --workspaces=false --audit-level=high
          npm --prefix web audit --workspaces=false --audit-level=high

      - name: Build web console (pre-test)
        run: npm --prefix web run build

      - name: Test server and CLI
        run: npm test -- --reporter=verbose

      - name: Test web console
        run: npm run test:web

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run verify:package

      - name: Smoke-test installed package
        run: bash .github/scripts/package-smoke.sh

  node22:
    name: Node 22.12 portable server and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build server for packaged CLI tests
        run: npm run build:server

      - name: Test server without Redis integration suites
        run: >-
          npx vitest run
          tests/bootstrap.test.ts
          tests/system-bootstrap.test.ts
          tests/package-contents.test.ts
          tests/release-readiness.test.ts
          tests/worker.test.ts
          tests/worker-signal-propagation.test.ts
          tests/supervisor-runtime.test.ts

      - name: Test web console
        run: npm run test:web

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run verify:package
